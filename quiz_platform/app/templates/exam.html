{% extends 'base.html' %}
{% block title %}Exam{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div><h4 class="mb-0">{{ attempt.exam.title }}</h4><small>{{ candidate.name }}</small></div>
  <div class="text-end"><div id="timer" class="fs-4 fw-bold"></div><small id="warn" class="text-danger"></small></div>
</div>
<div class="row">
  <div class="col-lg-3">
    <h6>Questions</h6>
    <div class="question-grid" id="questionGrid"></div>
    <ul class="small mt-3 list-unstyled">
      <li><span class="badge bg-success">Answered</span></li>
      <li><span class="badge bg-secondary">Unanswered</span></li>
      <li><span class="badge bg-warning text-dark">Review</span></li>
      <li><span class="badge bg-primary">Current</span></li>
    </ul>
  </div>
  <div class="col-lg-9">
    <div id="examPanel"></div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-outline-secondary" id="prevBtn">Previous</button>
      <button class="btn btn-outline-warning" id="clearBtn">Clear Response</button>
      <button class="btn btn-outline-info" id="markBtn">Mark for Review</button>
      <button class="btn btn-primary" id="nextBtn">Next</button>
      <button class="btn btn-danger ms-auto" data-bs-toggle="modal" data-bs-target="#submitModal">Submit Exam</button>
    </div>
  </div>
</div>

<div class="modal fade" id="submitModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Submit Exam</h5></div><div class="modal-body"><p id="summary"></p></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" id="submitNow">Submit Anyway</button></div></div></div>
</div>

<script>
window.__EXAM_DATA__ = {
  remaining: {{ remaining_seconds }},
  answers: [
    {% for a in answers %}
    {
      answerId: {{ a.id }},
      question_id: {{ a.question.id }},
      external_id: {{ a.question.external_id|tojson }},
      text: {{ a.question.text|tojson }},
      type: {{ a.question.qtype|tojson }},
      options: {{ a.question.options_json|tojson }},
      selected: {{ a.selected_answer_json|tojson }},
      marked: {{ 'true' if a.is_marked_review else 'false' }},
      visited: {{ 'true' if a.is_visited else 'false' }},
      category: {{ a.question.category|tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/exam.js') }}"></script>{% endblock %}
